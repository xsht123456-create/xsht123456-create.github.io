<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy 6 Months Anniversary!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* --- Global Styles --- */
* { box-sizing: border-box; }
html, body {
    height: 100%;
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #ffe6e6 0%, #ffcce0 100%);
    color: #d63384;
    overflow: hidden; /* กันการ scroll สุ่มเสี่ยงบนมือถือ */
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2rem, 8vw, 3rem); /* ปรับขนาดตามหน้าจอ */
    margin: 0 0 0.5em 0;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

/* --- Floating Hearts --- */
.heart-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}
.heart {
    position: absolute;
    bottom: -10vh;
    animation: float 6s linear infinite;
}
@keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

/* --- Welcome Screen (แก้ปัญหาแป้นพิมพ์บัง) --- */
#welcome-screen {
    position: fixed;
    inset: 0;
    background: rgba(255, 204, 221, 0.7);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10vh 20px; /* ใช้ padding แทนการสั่งกึ่งกลาง เพื่อให้ขยับได้เมื่อมีแป้นพิมพ์ */
    text-align: center;
    transition: opacity 0.8s ease;
    overflow-y: auto; /* ยอมให้เลื่อนดูได้ถ้าแป้นพิมพ์เบียดพื้นที่เกินไป */
}

.pin-container {
    display: flex;
    gap: 8px;
    margin: 20px 0;
    justify-content: center;
}

.pin-container input {
    width: clamp(40px, 12vw, 55px);
    height: clamp(50px, 15vw, 65px);
    font-size: 1.5rem;
    text-align: center;
    border-radius: 12px;
    border: 2px solid rgba(255, 128, 191, 0.5);
    background-color: #fff;
    color: #d63384;
    outline: none;
    box-shadow: 0 4px 10px rgba(214, 51, 132, 0.1);
}

/* --- Main Content (จัดหน้าใหม่) --- */
#main-content {
    display: none;
    opacity: 0;
    height: 100vh;
    width: 100%;
    position: relative;
    z-index: 50;
    padding: 20px;
    display: none; /* เริ่มต้นซ่อนไว้ */
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.container {
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 30px;
    width: 100%;
    max-width: 400px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
}

.photo-frame {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #fff;
    margin: 0 auto 20px auto;
    box-shadow: 0 8px 25px rgba(255, 153, 204, 0.6);
    animation: heartbeat 3s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

.photo-frame video { width: 100%; height: 100%; object-fit: cover; }

.message-text {
    font-size: 1.05rem;
    line-height: 1.5;
    margin: 10px 0;
    min-height: 3em;
}

.cursor { display: inline-block; width: 2px; background: #d63384; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.lyric-text {
    font-family: 'Dancing Script', cursive;
    font-size: 1.2rem;
    color: #ff508a;
    min-height: 2.5em;
    margin: 10px 0;
    opacity: 0;
    transition: 0.8s;
}
.lyric-text.visible { opacity: 1; }

.progress-container {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.4);
    border-radius: 10px;
    margin: 15px 0;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background: #ff508a;
    border-radius: 10px;
    transition: width 0.1s linear;
}

.timer {
    font-weight: bold;
    font-size: 0.95rem;
    background: rgba(255, 255, 255, 0.5);
    padding: 8px 15px;
    border-radius: 50px;
    display: inline-block;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="heart-bg" id="heart-bg"></div>
<audio id="bg-music"><source src="song.mp3" type="audio/mp3"></audio>

<div id="welcome-screen">
    <h1>เค้ามีอะไรจะบอก</h1>
    <p>ใส่รหัส 6 ตัวนะที่รัก ❤️</p>
    <div class="pin-container">
        <input type="number" maxlength="1" pattern="\d*" inputmode="numeric">
        <input type="number" maxlength="1" pattern="\d*" inputmode="numeric">
        <input type="number" maxlength="1" pattern="\d*" inputmode="numeric">
        <input type="number" maxlength="1" pattern="\d*" inputmode="numeric">
        <input type="number" maxlength="1" pattern="\d*" inputmode="numeric">
        <input type="number" maxlength="1" pattern="\d*" inputmode="numeric">
    </div>
    <p id="error-text" style="color: red; font-size: 0.9rem;"></p>
</div>

<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months!</h1>
        <div class="photo-frame">
            <video src="mylove.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="message-text" id="typing-text"></div>
        <div id="lyric-text" class="lyric-text"></div>
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
const correctPassword = "250625";
const inputs = document.querySelectorAll(".pin-container input");
const music = document.getElementById("bg-music");

// --- Input Focus Handling ---
inputs.forEach((input, i) => {
    input.addEventListener("input", (e) => {
        if (input.value.length > 1) input.value = input.value.slice(0, 1);
        if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
        checkPin();
    });
    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
});

function checkPin() {
    const pin = Array.from(inputs).map(i => i.value).join("");
    if (pin.length === 6) {
        if (pin === correctPassword) {
            document.getElementById("welcome-screen").style.opacity = "0";
            setTimeout(openGift, 800);
        } else {
            document.getElementById("error-text").innerText = "รหัสผิดอะ ลองใหม่นะ 🥺";
            inputs.forEach(i => i.value = "");
            inputs[0].focus();
        }
    }
}

function openGift() {
    document.getElementById("welcome-screen").style.display = "none";
    const main = document.getElementById("main-content");
    main.style.display = "flex";
    setTimeout(() => {
        main.style.opacity = "1";
        music.play();
        startTypewriter();
        startLyrics();
    }, 50);
}

// --- Typewriter ---
const message = "ขอบคุณที่อยู่ข้างกันมาตลอด 6 เดือนนะ<br>รักเธอที่สุดในโลกเลย ❤️";
let charIndex = 0;
function startTypewriter() {
    const el = document.getElementById("typing-text");
    el.innerHTML = '<span class="cursor"></span>';
    function type() {
        if (charIndex < message.length) {
            let char = message.charAt(charIndex);
            if (message.substring(charIndex, charIndex + 4) === "<br>") {
                char = "<br>"; charIndex += 3;
            }
            document.querySelector('.cursor').insertAdjacentHTML('beforebegin', char);
            charIndex++;
            setTimeout(type, 80);
        }
    }
    type();
}

// --- Music Progress & Lyrics ---
const lyrics = [
    { text: "เธอเพียงคนเดียวและเพียงเธอที่ต้องการ", time: 4200 },
    { text: "ฉันจะทำทุกทุกทางด้วยวิญญาณและหัวใจ", time: 8700 },
    { text: "นั่นคือฉันจะรักเธอไม่ว่าเป็นเมื่อไร", time: 14000 },
    { text: "ทั้งหัวใจฉันมีเธอเพียงคนเดียว ❤️", time: 19400 }
];

function startLyrics() {
    const el = document.getElementById("lyric-text");
    lyrics.forEach(line => {
        setTimeout(() => {
            el.innerText = line.text;
            el.classList.add("visible");
            setTimeout(() => el.classList.remove("visible"), 3500);
        }, line.time);
    });
}

music.addEventListener("timeupdate", () => {
    document.getElementById("progress-bar").style.width = (music.currentTime / music.duration * 100) + "%";
});

// --- Timer ---
const startDate = new Date(2025, 5, 25).getTime();
setInterval(() => {
    const d = Date.now() - startDate;
    const days = Math.floor(d / 86400000);
    const hrs = Math.floor((d % 86400000) / 3600000);
    const mins = Math.floor((d % 3600000) / 60000);
    const secs = Math.floor((d % 60000) / 1000);
    document.getElementById("timer").innerText = `${days} วัน ${hrs} ชม. ${mins} น. ${secs} วิ`;
}, 1000);

// --- Floating Hearts ---
setInterval(() => {
    const h = document.createElement('div');
    h.classList.add('heart');
    h.innerHTML = ['❤️','💖','💕'][Math.floor(Math.random()*3)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = Math.random() * 15 + 15 + 'px';
    document.getElementById('heart-bg').appendChild(h);
    setTimeout(() => h.remove(), 6000);
}, 1000);
</script>

</body>
</html>
