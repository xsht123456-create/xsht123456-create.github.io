<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy 6 Months Anniversary!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
html, body {
    min-height: 100vh;
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #ffe6e6 0%, #ffcce0 100%) !important;
    background-attachment: fixed;
    overflow-x: hidden;
}

/* HEART BG */
.heart-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}
.heart {
    position: absolute;
    bottom: -10vh;
    font-size: 20px;
    color: #ff99cc;
    opacity: 0.6;
    animation: float 6s linear infinite;
}
@keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

/* WELCOME */
#welcome-screen {
    position: relative;
    min-height: 100vh;
    width: 100%;
    text-align: center;
    padding: 10vh 16px calc(40px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#welcome-screen.keyboard-open {
    justify-content: flex-start;
    padding-top: 6vh;
}

.pin-container {
    display: flex;
    gap: 10px;
    margin: 30px 0;
}
.pin-container input {
    width: 50px;
    height: 60px;
    font-size: 2rem;
    text-align: center;
    border-radius: 12px;
    border: 2px solid rgba(255,128,191,0.6);
    background: rgba(255,245,248,0.9);
    color: #d63384;
}

h1 {
    font-family: 'Dancing Script';
    font-size: 2.8em;
    color: #d63384;
}

#error-text {
    color: red;
    min-height: 22px;
}

/* MAIN */
#main-content {
    display: none;
    opacity: 0;
    min-height: 100vh;
    width: 100%;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 30px 20px;
    border-radius: 30px;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(20px);
}

.photo-frame {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid #ff9acb;
    margin: 20px auto;
}

.photo-frame video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.lyric-text {
    min-height: 30px;
    font-weight: bold;
    color: #ff508a;
}

.progress-container {
    width: 80%;
    margin: 20px auto;
    height: 6px;
    background: rgba(255,255,255,.5);
    border-radius: 10px;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#ff99cc,#ff3366);
}

.timer {
    font-weight: bold;
    color: #ff4f88;
}
</style>
</head>

<body>

<div class="heart-bg" id="heart-bg"></div>

<audio id="bg-music">
    <source src="song.mp3" type="audio/mp3">
</audio>

<!-- LOGIN -->
<div id="welcome-screen">
    <h1>เค้ามีอะไรจะบอก</h1>
    <p>ใส่รหัส 6 ตัวนะที่รัก ❤️</p>

    <div class="pin-container">
        <input maxlength="1">
        <input maxlength="1">
        <input maxlength="1">
        <input maxlength="1">
        <input maxlength="1">
        <input maxlength="1">
    </div>

    <p id="error-text"></p>
</div>

<!-- MAIN -->
<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months!</h1>

        <div class="photo-frame">
            <video src="mylove.mp4" autoplay loop muted playsinline></video>
        </div>

        <p id="typing-text"></p>
        <div class="lyric-text" id="lyric-text"></div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
const correctPassword = "250625";
const inputs = document.querySelectorAll(".pin-container input");
const welcome = document.getElementById("welcome-screen");
const mainC = document.getElementById("main-content");
const error = document.getElementById("error-text");
const music = document.getElementById("bg-music");
const progressBar = document.getElementById("progress-bar");

inputs[0].focus();

inputs.forEach((input,i)=>{
 input.addEventListener("input",()=>{
  if(input.value && i<5) inputs[i+1].focus();
  checkPin();
 });

 input.addEventListener("focus",()=>{
  welcome.classList.add("keyboard-open");
  setTimeout(()=>input.scrollIntoView({block:"center",behavior:"smooth"}),100);
 });

 input.addEventListener("blur",()=>{
  setTimeout(()=>{
   if(![...inputs].some(el=>el===document.activeElement))
    welcome.classList.remove("keyboard-open");
  },200);
 });
});

function checkPin(){
 let pin=[...inputs].map(i=>i.value).join("");
 if(pin.length===6){
  if(pin===correctPassword){
   openGift();
  } else {
   error.innerText="รหัสผิดนะ 🥺";
   inputs.forEach(i=>i.value="");
   inputs[0].focus();
   setTimeout(()=>error.innerText="",2000);
  }
 }
}

function openGift(){
 welcome.style.display="none";
 mainC.style.display="flex";
 requestAnimationFrame(()=>mainC.style.opacity=1);
 music.play().catch(()=>{});
}

/* TIMER */
const startDate=new Date(2025,5,25).getTime();
setInterval(()=>{
 const d=Date.now()-startDate;
 if(d<0)return;
 document.getElementById("timer").innerText=
 `${Math.floor(d/86400000)} วัน ${Math.floor(d%86400000/3600000)} ชม. ${Math.floor(d%3600000/60000)} น. ${Math.floor(d%60000/1000)} วิ`;
},1000);

/* HEART FLOAT */
const heartBg=document.getElementById("heart-bg");
const heartSymbols=['❤️','💖','💗','💓','💕'];
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.textContent=heartSymbols[Math.random()*5|0];
 h.style.left=Math.random()*100+"vw";
 heartBg.appendChild(h);
 setTimeout(()=>h.remove(),8000);
},900);

/* MUSIC BAR */
music.addEventListener("timeupdate",()=>{
 if(music.duration)
 progressBar.style.width=(music.currentTime/music.duration*100)+"%";
});
</script>

</body>
</html>
