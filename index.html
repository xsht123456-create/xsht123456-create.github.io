<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy 6 Months Anniversary!</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: 'Sarabun', sans-serif;
    animation: bgShift 20s ease-in-out infinite;
}

@keyframes bgShift {
    0% { background:#ffe6e6; }
    33% { background:#ffd6e8; }
    66% { background:#e6d9ff; }
    100% { background:#ffe6e6; }
}

h1 {
    font-family: 'Dancing Script', cursive;
    color:#d63384;
}

/* floating hearts */
.heart-bg {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}
.heart {
    position:absolute;
    bottom:-10vh;
    font-size:20px;
    opacity:.6;
    animation: float 6s linear infinite;
}
@keyframes float {
    from { transform:translateY(0); opacity:0; }
    to { transform:translateY(-110vh); opacity:1; }
}

/* welcome */
#welcome-screen {
    position:fixed;
    inset:0;
    background:rgba(255,204,221,.95);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10;
    transition:opacity 1s;
}

.pin-container {
    display:flex;
    gap:10px;
}
.pin-container input {
    width:45px;
    height:55px;
    font-size:2rem;
    text-align:center;
    border-radius:10px;
    border:2px solid #ff80bf;
}

#error-text {
    color:red;
    margin-top:10px;
}

/* main */
#main-content {
    display:none;
    height:100vh;
    justify-content:center;
    align-items:center;
}

.container {
    background:white;
    padding:30px;
    border-radius:25px;
    width:360px;
    text-align:center;
}

@keyframes pulseSoft {
    0%{transform:scale(1)}
    50%{transform:scale(1.05)}
    100%{transform:scale(1)}
}

.photo-frame {
    width:180px;
    height:180px;
    border-radius:50%;
    overflow:hidden;
    border:6px solid #ff99cc;
    margin:20px auto;
    animation:pulseSoft 1.4s ease-in-out infinite;
}
.photo-frame video {
    width:100%;
    height:100%;
    object-fit:cover;
}

.lyric-text {
    min-height:2em;
    font-family:'Dancing Script', cursive;
    color:#ff6699;
    opacity:0;
    transition:.6s;
}
.lyric-text.show { opacity:1; }

.timer {
    margin-top:15px;
    font-weight:bold;
}

/* tap heart */
.tap-heart {
    position:fixed;
    font-size:24px;
    pointer-events:none;
    animation: pop 1s forwards;
}
@keyframes pop {
    from { transform:scale(.6); opacity:1; }
    to { transform:scale(1.6) translateY(-30px); opacity:0; }
}
</style>
</head>

<body>

<div class="heart-bg" id="heart-bg"></div>

<audio id="bg-music" src="song.mp3"></audio>

<div id="welcome-screen">
    <h1>ใส่รหัสก่อนนะ ❤️</h1>
    <div class="pin-container">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
    </div>
    <div id="error-text"></div>
</div>

<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months</h1>

        <div class="photo-frame">
            <video src="mylove.mp4" autoplay muted loop playsinline></video>
        </div>

        <p>รักเธอที่สุดเลย ❤️</p>

        <div id="lyric" class="lyric-text"></div>
        <div id="timer" class="timer"></div>
    </div>
</div>

<script>
const correctPassword="250625";
const inputs=document.querySelectorAll(".pin-container input");
const music=document.getElementById("bg-music");
const lyricEl=document.getElementById("lyric");
const welcome=document.getElementById("welcome-screen");
const main=document.getElementById("main-content");

inputs.forEach((inp,i)=>{
    inp.oninput=()=>{
        inp.value=inp.value.replace(/\D/g,'');
        if(inp.value && i<5) inputs[i+1].focus();
        checkPin();
    };
});

function checkPin(){
    const pin=[...inputs].map(i=>i.value).join('');
    if(pin.length===6){
        if(pin===correctPassword){
            welcome.style.opacity=0;
            setTimeout(()=>{
                welcome.style.display="none";
                main.style.display="flex";
                music.play();
                startLyrics();
            },1000);
        }else{
            document.getElementById("error-text").innerText="รหัสผิด 🥺";
            inputs.forEach(i=>i.value="");
            inputs[0].focus();
        }
    }
}

/* hearts bg */
const bg=document.getElementById("heart-bg");
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.textContent="❤️";
    h.style.left=Math.random()*100+"vw";
    bg.appendChild(h);
    setTimeout(()=>h.remove(),6000);
},800);

/* lyrics */
const lyrics=[
 {t:"เธอเพียงคนเดียวและเพียงเธอที่ต้องการ",d:4200},
 {t:"ฉันจะทำทุกทางด้วยวิญญาณและหัวใจ",d:4500},
 {t:"ไม่ว่าเป็นเมื่อไรสถานใด",d:5300},
 {t:"ทั้งหัวใจมีเธอคนเดียว ❤️",d:5400}
];
let idx=0;

function startLyrics(){
    lyricEl.textContent=lyrics[idx].t;
    lyricEl.classList.add("show");
    setTimeout(()=>{
        lyricEl.classList.remove("show");
        idx=(idx+1)%lyrics.length;
        setTimeout(startLyrics,800);
    },lyrics[idx].d);
}

/* tap heart */
document.addEventListener("click",e=>{
    const h=document.createElement("div");
    h.className="tap-heart";
    h.textContent="❤️";
    h.style.left=e.clientX+"px";
    h.style.top=e.clientY+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1000);
});

/* timer */
const startDate=new Date(2025,5,25).getTime();
setInterval(()=>{
    const d=Date.now()-startDate;
    if(d<0) return;
    const days=Math.floor(d/86400000);
    document.getElementById("timer").innerText=days+" วัน";
},1000);
</script>

</body>
</html>
