<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy 6 Months Anniversary!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* --- Global Styles --- */
html, body {
    margin: 0;
    padding: 0;
    font-family: 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #ffe6e6 0%, #ffcce0 100%);
    color: #d63384;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
    min-height: 100vh;
    min-height: 100dvh; /* มือถือยุคใหม่ ใช้ dvh จะนิ่งขึ้น */
    -webkit-tap-highlight-color: transparent;
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 3em;
    margin-bottom: 0.5em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

/* --- Floating Hearts Animation Background --- */
.heart-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.heart {
    position: absolute;
    bottom: -10vh;
    font-size: 20px;
    color: #ff99cc;
    opacity: 0.6;
    animation: float 6s linear infinite;
}
@keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

/* --- Welcome Screen --- */
#welcome-screen {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    z-index: 100;
    transition: opacity 0.8s ease-in-out, transform 0.3s ease;
}

/* การ์ดตรงกลางหน้าล็อกอิน */
.welcome-card {
    width: 100%;
    max-width: 420px;
    padding: 28px 20px 24px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    text-align: center;
    box-sizing: border-box;
    box-shadow: 0 10px 28px rgba(255, 128, 191, 0.25);
}

/* เวลาเปิดคีย์บอร์ด: ดันขึ้นด้านบนหน่อย */
#welcome-screen.keyboard-open {
    align-items: flex-start;
    padding-top: 10vh;
}

/* PIN */
.pin-label {
    margin-top: 8px;
    font-size: 0.98rem;
}

.pin-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 24px 0 18px;
}

.pin-container input {
    width: 46px;
    height: 52px;
    font-size: 1.7rem;
    text-align: center;
    border-radius: 12px;
    border: 2px solid rgba(255, 128, 191, 0.7);
    outline: none;
    background-color: rgba(255, 245, 248, 0.85);
    color: #d63384;
    box-shadow: 0 3px 8px rgba(255, 153, 204, 0.4);
}
.pin-container input:focus {
    border-color: #ff66aa;
}

/* error */
#error-text {
    color: #ff3333;
    margin-top: 6px;
    font-weight: bold;
    min-height: 1.4em;
    font-size: 0.9rem;
}

/* --- Heart Explosion Effect --- */
.explosion-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 101;
}
.exploding-heart {
    position: absolute;
    font-size: 24px;
    color: #ff3366;
    animation: explode 0.8s ease-out forwards;
}
@keyframes explode {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
}

/* --- Main Content --- */
#main-content {
    display: none;
    opacity: 0;
    min-height: 100vh;
    min-height: 100dvh;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 50;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    transition: opacity 1.2s ease-in-out;
}

.container {
    background: rgba(255, 255, 255, 0.32);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 32px 22px 26px;
    border-radius: 28px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-sizing: border-box;
    margin: 0 auto;
    box-shadow: 0 12px 30px rgba(255, 128, 191, 0.25);
}

/* รูป/วิดีโอ */
.photo-frame {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid rgba(255, 153, 204, 0.85);
    margin: 20px auto 16px;
    animation: heartbeat 3s ease-in-out infinite;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.photo-frame video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ข้อความ */
.message-text {
    font-size: 1.02rem;
    line-height: 1.6;
    margin-bottom: 14px;
    min-height: 3.2em;
}

.cursor {
    display: inline-block;
    width: 2px;
    background-color: #d63384;
    animation: blink 1s infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

.lyric-text {
    font-weight: bold;
    font-size: 1.25rem;
    color: #ff508a;
    opacity: 0;
    transition: all 0.8s ease;
    min-height: 2.3em;
    font-family: 'Dancing Script', cursive;
    margin-top: 4px;
}
.lyric-text.visible {
    opacity: 1;
}

/* Timer & Progress */
.timer {
    margin-top: 14px;
    font-weight: bold;
    color: #ff6699;
    font-size: 0.95rem;
}

.progress-container {
    width: 80%;
    height: 6px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 10px;
    margin: 18px auto 4px;
    overflow: hidden;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff99cc, #ff3366);
}

/* 📱 Responsive: จอเล็กทั่วไป */
@media (max-width: 480px) {
    h1 {
        font-size: 2.3em;
    }
    .welcome-card {
        padding: 24px 16px 20px;
        border-radius: 22px;
    }
    .container {
        padding: 26px 18px 22px;
        border-radius: 24px;
    }
    .photo-frame {
        width: 150px;
        height: 150px;
    }
    .message-text {
        font-size: 0.96rem;
    }
    .lyric-text {
        font-size: 1.08rem;
    }
    .pin-container {
        gap: 8px;
    }
    .pin-container input {
        width: 42px;
        height: 48px;
        font-size: 1.55rem;
    }
}

/* จอเตี้ยมาก (มือถือเล็ก+คีย์บอร์ด) */
@media (max-height: 640px) {
    #welcome-screen.keyboard-open {
        padding-top: 6vh;
    }
    .welcome-card {
        padding-top: 18px;
        padding-bottom: 18px;
    }
    .photo-frame {
        width: 135px;
        height: 135px;
        margin: 16px auto 10px;
    }
    h1 {
        font-size: 2rem;
    }
    .container {
        padding: 22px 14px 18px;
    }
}
</style>
</head>

<body>

<div class="heart-bg" id="heart-bg"></div>

<audio id="bg-music">
    <source src="song.mp3" type="audio/mp3">
</audio>

<!-- WELCOME -->
<div id="welcome-screen">
    <div class="welcome-card">
        <h1>เค้ามีอะไรจะบอก</h1>
        <p class="pin-label">ใส่รหัส 6 ตัวนะที่รัก ❤️</p>

        <div class="pin-container">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
            <input type="password" maxlength="1" inputmode="numeric">
        </div>

        <p id="error-text"></p>
    </div>
</div>

<!-- MAIN -->
<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months!</h1>

        <div class="photo-frame">
            <video src="mylove.mp4" autoplay loop muted playsinline></video>
        </div>

        <p class="message-text" id="typing-text"></p>
        <div id="lyric-text" class="lyric-text"></div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
const correctPassword = "250625";
const inputs        = document.querySelectorAll(".pin-container input");
const music         = document.getElementById("bg-music");
const lyricEl       = document.getElementById("lyric-text");
const welcomeScreen = document.getElementById("welcome-screen");
const mainContent   = document.getElementById("main-content");
const errorText     = document.getElementById("error-text");
const progressBar   = document.getElementById("progress-bar");

/* --- Floating Hearts --- */
const heartBg       = document.getElementById('heart-bg');
const heartSymbols  = ['❤️','💖','💗','💓','💕'];
setInterval(() => {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = heartSymbols[Math.floor(Math.random()*heartSymbols.length)];
    h.style.left = Math.random()*100+'vw';
    heartBg.appendChild(h);
    setTimeout(()=>h.remove(),9000);
},800);

/* --- Input Logic --- */
inputs[0].focus();
inputs.forEach((input,i)=>{
    input.addEventListener("input",()=>{
        input.value = input.value.replace(/\D/g,'');
        if(input.value && i<inputs.length-1) inputs[i+1].focus();
        checkPin();
    });

    input.addEventListener("keydown",e=>{
        if(e.key==="Backspace" && !input.value && i>0) inputs[i-1].focus();
    });

    /* เวลาโฟกัส ยกจอขึ้นเล็กน้อย กันคีย์บอร์ดบัง */
    input.addEventListener("focus", () => {
        welcomeScreen.classList.add("keyboard-open");
        setTimeout(() => {
            input.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }, 80);
    });

    input.addEventListener("blur",()=> {
        setTimeout(()=>{
            if (![...inputs].some(i=>i===document.activeElement)) {
                welcomeScreen.classList.remove("keyboard-open");
            }
        },100);
    });
});

function checkPin(){
    const pin=[...inputs].map(i=>i.value).join("");
    if(pin.length===6){
        if(pin===correctPassword){
            playExplosionEffect();
            setTimeout(openGift,800);
        }else{
            errorText.innerText="รหัสผิดอะ ลองใหม่ซิ 🥺";
            inputs.forEach(i=>i.value="");
            inputs[0].focus();
            setTimeout(()=>errorText.innerText="",2000);
        }
    }
}

/* --- Explosion --- */
function playExplosionEffect(){
    const c=document.createElement('div');
    c.className='explosion-container';
    document.body.appendChild(c);
    for(let i=0;i<20;i++){
        const h=document.createElement('div');
        h.className='exploding-heart';
        h.textContent='💖';
        const a=Math.random()*Math.PI*2;
        const d=Math.random()*150+50;
        h.style.setProperty('--x',Math.cos(a)*d+'px');
        h.style.setProperty('--y',Math.sin(a)*d+'px');
        c.appendChild(h);
    }
    setTimeout(()=>c.remove(),1000);
}

/* --- Typewriter --- */
const messageToType="ขอบคุณที่อยู่ข้างกันมาตลอด 6 เดือนนะ<br>รักเธอที่สุดในโลกเลย ❤️";
let typeIndex=0;
function startTypewriter(){
    const el=document.getElementById("typing-text");
    el.innerHTML='<span class="cursor"></span>';
    (function type(){
        if(typeIndex<messageToType.length){
            let ch=messageToType.substring(typeIndex,typeIndex+4)==="<br>"?"<br>":messageToType[typeIndex];
            typeIndex+=ch==="<br>"?4:1;
            el.querySelector('.cursor').insertAdjacentHTML("beforebegin",ch);
            setTimeout(type,80);
        }
    })();
}

/* --- Lyrics --- */
const LYRIC_INTRO_DELAY=1500;
const lyricsWithTiming=[
 {text:"เธอเพียงคนเดียวและเพียงเธอที่ต้องการ",duration:4200},
 {text:"ฉันจะทำทุกทุกทางด้วยวิญญาณและหัวใจ",duration:4500},
 {text:"นั่นคือฉันจะรักเธอไม่ว่าเป็นเมื่อไรสถานใด",duration:5300},
 {text:"ทั้งหัวใจฉันมีเธอเพียงคนเดียว ❤️",duration:5400}
];
let lyricIndex=0,lyricTimer=null;
function resetLyrics(){
 if(lyricTimer)clearTimeout(lyricTimer);
 lyricIndex=0; lyricEl.textContent=""; lyricEl.classList.remove("visible");
}
function startLyrics(){
 if(lyricIndex>=lyricsWithTiming.length)return;
 lyricEl.textContent=lyricsWithTiming[lyricIndex].text;
 lyricEl.classList.add("visible");
 lyricTimer=setTimeout(()=>{
   lyricEl.classList.remove("visible");
   lyricIndex++;
   setTimeout(startLyrics,800);
 },lyricsWithTiming[lyricIndex].duration);
}

/* --- Open Gift --- */
function openGift(){
 welcomeScreen.style.opacity=0;
 setTimeout(()=>{
   welcomeScreen.style.display="none";
   mainContent.style.display="flex";
   requestAnimationFrame(()=>{
     mainContent.style.opacity=1;
     music.play().catch(()=>{});
     setTimeout(startTypewriter,1000);
     resetLyrics();
     setTimeout(startLyrics,LYRIC_INTRO_DELAY);
   });
 },800);
}

/* --- Music Events --- */
music.addEventListener("ended",()=>{
 resetLyrics();
 music.currentTime=0;
 progressBar.style.width="0%";
 music.play();
 setTimeout(startLyrics,LYRIC_INTRO_DELAY);
});

music.addEventListener("timeupdate",()=>{
 if(music.duration){
   progressBar.style.width=(music.currentTime/music.duration*100)+"%";
 }
});

/* หยุดเพลงตอนออกจากแท็บ */
document.addEventListener("visibilitychange",()=>{
 if(document.hidden) music.pause();
 else if(music.currentTime>0) music.play().catch(()=>{});
});

/* --- Timer --- */
const startDate=new Date(2025,5,25).getTime();
setInterval(()=>{
 const d=Date.now()-startDate;
 if(d<0)return;
 document.getElementById("timer").innerText=
 `${Math.floor(d/86400000)} วัน ${Math.floor(d%86400000/3600000)} ชม. ${Math.floor(d%3600000/60000)} น. ${Math.floor(d%60000/1000)} วิ`;
},1000);
</script>

</body>
</html>
