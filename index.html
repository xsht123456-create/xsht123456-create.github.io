<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy 6 Months Anniversary!</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: 'Sarabun', sans-serif;
    background: linear-gradient(-45deg, #ffe6e6, #ffd6e8, #ffeef6);
    background-size: 400% 400%;
    animation: bgFlow 18s ease infinite;
    color: #d63384;
}

@keyframes bgFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

#welcome-screen {
    position: fixed;
    inset: 0;
    background: #ffccdd;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 1000;
    transition: opacity 1s;
}

.pin-container {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.pin-container input {
    width: 45px;
    height: 55px;
    font-size: 1.8rem;
    text-align: center;
    border-radius: 10px;
    border: 2px solid #ff4d94;
    outline: none;
}

#error-text {
    color: red;
    margin-top: 10px;
}

#main-content {
    display: none;
    opacity: 0;
    height: 100vh;
    justify-content: center;
    align-items: center;
    transition: opacity 1.5s;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 350px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,.1);
}

.photo-frame {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #ff99cc;
    margin: 15px auto;
    animation: softBeat 1.6s ease-in-out infinite;
}

@keyframes softBeat {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
}

.photo-frame video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.lyric-text {
    font-weight: bold;
    color: #ff6699;
    opacity: 0;
    transition: opacity 0.8s;
    min-height: 2em;
}

.lyric-text.visible {
    opacity: 1;
}

.timer {
    margin-top: 10px;
    font-weight: bold;
    color: #ff6699;
}

/* ❤️ หัวใจแตก */
.tap-heart {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    animation: tapPop 0.9s ease-out forwards;
    z-index: 999;
}

@keyframes tapPop {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(1.8) translateY(-40px); opacity: 0; }
}
</style>
</head>

<body>

<audio id="bg-music" loop>
    <source src="song.mp3" type="audio/mp3">
</audio>

<div id="welcome-screen">
    <h1>เค้ามีอะไรจะบอก</h1>
    <p>ใส่รหัส 6 ตัว ❤️</p>

    <div class="pin-container">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
    </div>

    <p id="error-text"></p>
</div>

<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months</h1>

        <div class="photo-frame">
            <video src="mylove.mp4" autoplay loop muted playsinline></video>
        </div>

        <p>ขอบคุณที่อยู่ข้างกันมาตลอด 6 เดือนนะ<br>รักเธอมาก ❤️</p>

        <div id="lyric-text" class="lyric-text"></div>
        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
/* 🔐 PIN */
const correctPassword = "250625";
const inputs = document.querySelectorAll(".pin-container input");
const music = document.getElementById("bg-music");
const lyricEl = document.getElementById("lyric-text");

/* 🎵 เนื้อเพลง */
const lyricsWithTiming = [
    { text: "เธอเพียงคนเดียวและเพียงเธอที่ต้องการ", duration: 4200 },
    { text: "ฉันจะทำทุกทุกทางด้วยวิญญาณและหัวใจ", duration: 4500 },
    { text: "นั่นคือฉันจะรักเธอไม่ว่าเป็นเมื่อไรสถานใด", duration: 5000 },
    { text: "ทั้งหัวใจฉันมีเธอเพียงคนเดียว ❤️", duration: 5000 }
];

let lyricIndex = 0;
let lyricTimeout = null;

/* PIN logic */
inputs[0].focus();
inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, '');
        if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
        checkPin();
    });
    input.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
});

function checkPin() {
    const pin = [...inputs].map(i => i.value).join("");
    if (pin.length === 6) {
        if (pin === correctPassword) openGift();
        else {
            document.getElementById("error-text").innerText = "รหัสไม่ถูกต้อง 🥺";
            inputs.forEach(i => i.value = "");
            inputs[0].focus();
        }
    }
}

function openGift() {
    document.getElementById("welcome-screen").style.display = "none";
    const main = document.getElementById("main-content");
    main.style.display = "flex";
    setTimeout(() => main.style.opacity = 1, 50);

    music.currentTime = 0;
    music.volume = 0.5;
    music.play();

    startLyrics();
}

/* 🎤 เนื้อร้องวน */
function startLyrics() {
    lyricIndex = 0;
    showLyric();
}

function showLyric() {
    lyricEl.textContent = lyricsWithTiming[lyricIndex].text;
    lyricEl.classList.add("visible");

    lyricTimeout = setTimeout(() => {
        lyricEl.classList.remove("visible");
        lyricIndex++;

        if (lyricIndex >= lyricsWithTiming.length) lyricIndex = 0;

        setTimeout(showLyric, 700);
    }, lyricsWithTiming[lyricIndex].duration);
}

/* ❤️ แตะแล้วหัวใจแตก */
document.addEventListener("click", e => {
    const heart = document.createElement("div");
    heart.className = "tap-heart";
    heart.textContent = "💖";
    heart.style.left = e.clientX + "px";
    heart.style.top = e.clientY + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 900);
});

/* ⏳ ตัวนับเวลา */
const startDate = new Date(2025, 5, 25).getTime();
setInterval(() => {
    const d = Date.now() - startDate;
    document.getElementById("timer").innerText =
        Math.floor(d/86400000)+" วัน "+
        Math.floor(d%86400000/3600000)+" ชม. "+
        Math.floor(d%3600000/60000)+" น. "+
        Math.floor(d%60000/1000)+" วิ";
}, 1000);
</script>

</body>
</html>
