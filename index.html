<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy 6 Months Anniversary!</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
:root { --pink: #ff4d94; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

body {
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    background: linear-gradient(180deg, #ffe6e6, #ffccdd);
    color: #d63384;
    height: 100dvh;
    overflow: hidden;
    position: fixed;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#welcome-screen, #main-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1s ease, transform 1s cubic-bezier(.22,.61,.36,1);
    padding: 20px;
}

#welcome-screen { background: linear-gradient(180deg, #ffccdd, #ffe6e6); z-index: 10; }
#welcome-screen.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }

#password-input {
    width: 200px;
    padding: 14px;
    text-align: center;
    border-radius: 30px;
    border: 2px solid var(--pink);
    outline: none;
    letter-spacing: 8px;
    transition: transform .25s, box-shadow .25s;
    font-size: 20px; /* ป้องกัน iOS ซูม */
    height: 60px;
}

#password-input:focus { box-shadow: 0 0 0 4px rgba(255,77,148,.2); }
.shake { animation: shake .4s; }
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
}

.btn-open {
    margin-top: 20px;
    padding: 12px 40px;
    font-size: 1.2rem;
    border-radius: 50px;
    border: none;
    background: var(--pink);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255,77,148,.35);
}

#main-content { opacity: 0; pointer-events: none; transform: scale(.96); }
#main-content.show { opacity: 1; pointer-events: auto; transform: scale(1); }

.container {
    width: 100%;
    max-width: 340px;
    padding: 25px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,.1);
}

.photo-frame {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 20px;
    border: 5px solid white;
}

.photo-frame img { width: 100%; height: 100%; object-fit: cover; }
.lyric-text { min-height: 50px; margin: 15px 0; font-size: 1.1rem; font-weight: bold; color: #ff6699; opacity: 0; transition: opacity 0.8s; }
.lyric-text.visible { opacity: 1; }
.timer { margin-top: 15px; font-size: 0.9rem; background: #fff0f5; padding: 10px; border-radius: 15px; color: #ff4d94; }
</style>
</head>
<body>

<audio id="bg-music" loop>
    <source src="song.mp3" type="audio/mp3">
</audio>

<div id="welcome-screen">
    <h1>ใส่รหัสผ่าน ❤️</h1>
    <input id="password-input" 
           type="password" 
           inputmode="numeric" 
           maxlength="6" 
           placeholder="••••••"
           autocomplete="off">
    <button class="btn-open" onclick="checkPassword()">ยืนยัน</button>
    <p id="error-text"></p>
</div>

<div id="main-content">
    <div class="container">
        <h2 style="margin-top:0">Happy 6 Months</h2>
        <div class="photo-frame">
            <img src="mylove.jpg" alt="Love">
        </div>
        <p>ขอบคุณที่อยู่ข้างกันมาตลอดนะ<br>รักเธอมากครับ ❤️</p>
        <div id="lyric-text" class="lyric-text"></div>
        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
const correctPassword = "250625";

function checkPassword() {
    const input = document.getElementById("password-input");
    const error = document.getElementById("error-text");
    if (input.value === correctPassword) {
        openGift();
    } else {
        document.getElementById("error-text").innerText = "รหัสไม่ถูกต้องนะครับ";
        input.classList.add("shake");
        input.value = "";
        setTimeout(() => input.classList.remove("shake"), 400);
    }
}

function openGift() {
    const music = document.getElementById("bg-music");
    music.volume = 0.5;
    music.play().catch(() => {});
    document.getElementById("welcome-screen").classList.add("hide");
    setTimeout(() => {
        document.getElementById("main-content").classList.add("show");
        startLyrics();
    }, 900);
}

const lyricsWithTiming = [
    { text: "เธอเพียงคนเดียวและเพียงเธอที่ต้องการ", duration: 4000 },
    { text: "ฉันจะทำทุกทุกทางด้วยวิญญาณและหัวใจ", duration: 4000 },
    { text: "นั่นคือฉันจะรักเธอไม่ว่าเป็นเมื่อไร", duration: 4000 },
    { text: "ทั้งหัวใจฉันมีเธอเพียงคนเดียว ❤️", duration: 4000 }
];

function startLyrics() {
    const el = document.getElementById("lyric-text");
    let i = 0;
    function show() {
        if (i >= lyricsWithTiming.length) i = 0;
        el.innerText = lyricsWithTiming[i].text;
        el.classList.add("visible");
        setTimeout(() => {
            el.classList.remove("visible");
            setTimeout(() => { i++; show(); }, 500);
        }, lyricsWithTiming[i].duration);
    }
    show();
}

const startDate = new Date(2025, 5, 25).getTime(); 
setInterval(() => {
    const d = new Date().getTime() - startDate;
    document.getElementById("timer").innerText = 
        Math.floor(d/86400000)+" วัน "+Math.floor(d%86400000/3600000)+" ชม. "+
        Math.floor(d%3600000/60000)+" น. "+Math.floor(d%60000/1000)+" วิ";
}, 1000);
</script>
</body>
</html>
