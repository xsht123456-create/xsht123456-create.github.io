<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <!-- 🔒 ปิดซูม + เหมาะกับมือถือ -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Happy 6 Months Anniversary!</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* 🔒 ล็อกการเลื่อน + gesture */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #ffe6e6;
            color: #d63384;
        }

        #welcome-screen {
            position: fixed;
            inset: 0;
            background-color: #ffccdd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease-in-out;
            text-align: center;
        }

        .btn-open {
            background-color: #ff4d94;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 148, 0.4);
            font-family: 'Sarabun', sans-serif;
        }

        #password-input {
            padding: 12px;
            font-size: 1.3rem;
            text-align: center;
            border-radius: 30px;
            border: 2px solid #ff4d94;
            outline: none;
            width: 180px;
            margin-bottom: 15px;
            letter-spacing: 6px;
        }

        #error-text {
            color: red;
            margin-top: 10px;
        }

        #main-content {
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: none;
            height: 100vh;
            width: 100vw;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 350px;
            max-width: 90%;
            text-align: center;
        }

        .photo-frame {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #ff99cc;
            margin: 15px auto;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .lyric-text {
            font-size: 1.1rem;
            color: #ff6699;
            font-weight: bold;
            opacity: 0;
            transform: translateY(10px);
            transition: 1s;
        }

        .lyric-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .timer {
            margin-top: 10px;
            font-weight: bold;
            color: #ff6699;
        }

        /* 📱 มือถือ */
        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .container { padding: 20px; }
            .photo-frame { width: 150px; height: 150px; }
            .btn-open { font-size: 1.1rem; padding: 10px 24px; }
            #password-input { font-size: 1.2rem; width: 160px; }
            .lyric-text { font-size: 1rem; }
        }
    </style>
</head>

<body>

<audio id="bg-music" loop>
    <source src="song.mp3" type="audio/mp3">
</audio>

<!-- หน้าใส่รหัส -->
<div id="welcome-screen">
    <h1>เค้ามีอะไรจะบอก</h1>
    <p>ใส่รหัส 6 ตัว ❤️</p>

    <!-- ✅ บังคับคีย์บอร์ดตัวเลข -->
    <input
        type="password"
        id="password-input"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        placeholder="••••••">

    <button class="btn-open" onclick="checkPassword()">ยืนยัน</button>
    <p id="error-text"></p>
</div>

<!-- เนื้อหาหลัก -->
<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months</h1>

        <div class="photo-frame">
            <img src="mylove.jpg" alt="My Love">
        </div>

        <p>ขอบคุณที่อยู่ข้างกันมาตลอด 6 เดือนนะ<br>รักเธอมาก ❤️</p>

        <div id="lyric-container">
            <div id="lyric-text" class="lyric-text"></div>
        </div>

        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
/* 🔐 ตั้งรหัส */
const correctPassword = "250625";

/* กันพิมพ์ที่ไม่ใช่ตัวเลข */
const passInput = document.getElementById("password-input");
passInput.addEventListener("input", () => {
    passInput.value = passInput.value.replace(/\D/g, '');
});

function checkPassword() {
    const error = document.getElementById("error-text");

    if (passInput.value === correctPassword) {
        error.innerText = "";
        openGift();
    } else {
        error.innerText = "รหัสไม่ถูกต้อง 🥺";
    }
}

/* กด Enter ได้ */
passInput.addEventListener("keyup", e => {
    if (e.key === "Enter") checkPassword();
});

function openGift() {
    const welcome = document.getElementById("welcome-screen");
    const main = document.getElementById("main-content");
    const music = document.getElementById("bg-music");

    document.body.style.position = "fixed";
    document.body.style.width = "100%";

    music.volume = 0.5;
    music.play();

    welcome.style.opacity = 0;
    setTimeout(() => {
        welcome.style.display = "none";
        main.style.display = "flex";
        setTimeout(() => main.style.opacity = 1, 50);
        startLyrics();
    }, 1000);
}

/* 🎵 เนื้อเพลง */
const lyricsWithTiming = [
    { text: "เธอเพียงคนเดียวและเพียงเธอที่ต้องการ", duration: 4200 },
    { text: "ฉันจะทำทุกทุกทางด้วยวิญญาณและหัวใจ", duration: 4500 },
    { text: "นั่นคือฉันจะรักเธอไม่ว่าเป็นเมื่อไรสถานใด", duration: 5000 },
    { text: "ทั้งหัวใจฉันมีเธอเพียงคนเดียว ❤️", duration: 5000 }
];

function startLyrics() {
    const el = document.getElementById("lyric-text");
    let i = 0;

    function show() {
        if (i >= lyricsWithTiming.length) return;
        el.innerText = lyricsWithTiming[i].text;
        el.classList.add("visible");

        setTimeout(() => {
            el.classList.remove("visible");
            i++;
            setTimeout(show, 1000);
        }, lyricsWithTiming[i].duration);
    }
    show();
}

/* ⏱️ ตัวนับเวลา */
const startDate = new Date(2025, 5, 25).getTime();
setInterval(() => {
    const now = Date.now();
    const d = now - startDate;
    document.getElementById("timer").innerText =
        Math.floor(d/86400000)+" วัน "+
        Math.floor(d%86400000/3600000)+" ชม. "+
        Math.floor(d%3600000/60000)+" น. "+
        Math.floor(d%60000/1000)+" วิ";
}, 1000);

/* 🚫 ปิด pinch / double tap zoom */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>

</body>
</html>
