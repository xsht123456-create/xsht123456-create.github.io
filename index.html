<!-- MUSIC -->
<button
    class="music"
    id="musicButton"
    aria-label="เล่น/หยุดเพลง">
    ♫
</button>

<audio
    id="music"
    src="song.mp3"
    loop>
</audio>


<script>

const music =
    document.getElementById("music");

const button =
    document.getElementById("musicButton");

let musicStarted = false;


/* =====================================================
   START MUSIC
===================================================== */

async function startMusic() {

    if (musicStarted) return;

    try {

        music.volume = 0.45;

        await music.play();

        musicStarted = true;

        button.textContent = "Ⅱ";

    } catch (error) {

        console.log(
            "Browser blocked autoplay:",
            error
        );

    }

}


/* =====================================================
   FIRST USER INTERACTION
===================================================== */

document.addEventListener(
    "click",
    startMusic,
    {
        once: true
    }
);

document.addEventListener(
    "touchstart",
    startMusic,
    {
        once: true
    }
);


/* =====================================================
   MUSIC BUTTON
===================================================== */

button.addEventListener(
    "click",
    async function(event) {

        /*
         * ป้องกัน click นี้ไปทำงานซ้ำ
         * กับ document click
         */

        event.stopPropagation();


        if (music.paused) {

            try {

                music.volume = 0.45;

                await music.play();

                musicStarted = true;

                button.textContent = "Ⅱ";

            } catch (error) {

                console.log(
                    "Music cannot play:",
                    error
                );

            }

        } else {

            music.pause();

            button.textContent = "♫";

        }

    }
);


/* =====================================================
   UPDATE BUTTON
===================================================== */

music.addEventListener(
    "play",
    function() {

        button.textContent = "Ⅱ";

    }
);


music.addEventListener(
    "pause",
    function() {

        button.textContent = "♫";

    }
);


/* =====================================================
   ERROR CHECK
===================================================== */

music.addEventListener(
    "error",
    function() {

        console.error(
            "ไม่พบไฟล์ song.mp3"
        );

    }
);

</script>
