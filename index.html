<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy 6 Months Anniversary!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:'Sarabun',sans-serif;
    background:linear-gradient(135deg,#ffe6e6,#ffcce0);
    color:#d63384;
}
h1{
    font-family:'Dancing Script',cursive;
    font-size:3em;
}

/* Floating Hearts */
.heart-bg{position:fixed;inset:0;pointer-events:none}
.heart{
    position:absolute;
    bottom:-10vh;
    animation:float 6s linear infinite;
    opacity:.6;
}
@keyframes float{
    to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}

/* Welcome */
#welcome-screen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(15px);
    background:rgba(255,204,221,.6);
    transition:opacity 1s;
}
#welcome-screen.keyboard-open{
    justify-content:flex-start;
    padding-top:10vh;
}

.pin-container{
    display:flex;
    gap:12px;
    margin:30px 0;
}
.pin-container input{
    width:50px;height:60px;
    font-size:2rem;
    text-align:center;
    border-radius:12px;
    border:2px solid rgba(255,128,191,.5);
    background:rgba(255,245,248,.8);
    color:#d63384;
    box-shadow:0 4px 15px rgba(214,51,132,.15);
    transition:.3s;
}
.pin-container input:focus{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 8px 20px rgba(214,51,132,.3);
    background:#fff;
}
#error-text{min-height:1.5em;color:#ff3333}

/* Explosion */
.explosion-container{position:absolute;inset:0;pointer-events:none}
.exploding-heart{
    position:absolute;
    animation:explode .8s forwards;
}
@keyframes explode{
    to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}
}

/* Main */
#main-content{
    display:none;
    opacity:0;
    height:100vh;
    justify-content:center;
    align-items:center;
    transition:opacity 1.5s;
}
.container{
    background:rgba(255,255,255,.3);
    backdrop-filter:blur(20px);
    padding:40px;
    border-radius:30px;
    text-align:center;
}
.photo-frame{
    width:180px;height:180px;
    border-radius:50%;
    overflow:hidden;
    margin:20px auto;
    animation:heartbeat 3s infinite;
}
@keyframes heartbeat{50%{transform:scale(1.05)}}
.photo-frame video{width:100%;height:100%;object-fit:cover}

.message-text{min-height:3.2em}
.cursor{width:2px;background:#d63384;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

.lyric-text{
    font-size:1.3rem;
    opacity:0;
    transition:.8s;
    min-height:2.5em;
    font-family:'Dancing Script',cursive;
}
.lyric-text.visible{opacity:1}

.progress-container{height:6px;background:#fff4;border-radius:10px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#ff99cc,#ff3366)}

.timer{margin-top:15px;color:#ff6699}

@media(max-width:480px){
    h1{font-size:2.3em}
    .photo-frame{width:150px;height:150px}
}
</style>
</head>

<body>

<div class="heart-bg" id="heart-bg"></div>

<audio id="bg-music">
    <source src="song.mp3" type="audio/mp3">
</audio>

<div id="welcome-screen">
    <h1>เค้ามีอะไรจะบอก</h1>
    <p>ใส่รหัส 6 ตัวนะที่รัก ❤️</p>

    <div class="pin-container">
        <input type="password" maxlength="1">
        <input type="password" maxlength="1">
        <input type="password" maxlength="1">
        <input type="password" maxlength="1">
        <input type="password" maxlength="1">
        <input type="password" maxlength="1">
    </div>
    <p id="error-text"></p>
</div>

<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months!</h1>
        <div class="photo-frame">
            <video src="mylove.mp4" autoplay loop muted playsinline></video>
        </div>
        <p class="message-text" id="typing-text"></p>
        <div class="lyric-text" id="lyric-text"></div>
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
const correctPassword="250625";
const inputs=document.querySelectorAll(".pin-container input");
const music=document.getElementById("bg-music");
const lyricEl=document.getElementById("lyric-text");
const welcome=document.getElementById("welcome-screen");
const main=document.getElementById("main-content");
const progress=document.getElementById("progress-bar");
let lyricTimer=null,isPaused=false;

/* Floating hearts */
const hearts=['❤️','💖','💗'];
setInterval(()=>{
 const h=document.createElement('div');
 h.className='heart';
 h.textContent=hearts[Math.floor(Math.random()*hearts.length)];
 h.style.left=Math.random()*100+'vw';
 document.getElementById('heart-bg').appendChild(h);
 setTimeout(()=>h.remove(),8000);
},800);

/* PIN logic */
inputs[0].focus();
inputs.forEach((i,idx)=>{
 i.addEventListener("input",()=>{
   i.value=i.value.replace(/\D/g,'');
   if(i.value && idx<inputs.length-1) inputs[idx+1].focus();
   checkPin();
 });
 i.addEventListener("focus",()=>welcome.classList.add("keyboard-open"));
 i.addEventListener("blur",()=>{
   setTimeout(()=>{
     if(![...inputs].some(x=>x===document.activeElement))
       welcome.classList.remove("keyboard-open");
   },100);
 });
});

function checkPin(){
 const pin=[...inputs].map(i=>i.value).join("");
 if(pin.length===6 && pin===correctPassword){
   openGift();
 }
}

/* Typewriter */
const msg="ขอบคุณที่อยู่ข้างกันมาตลอด 6 เดือนนะ<br>รักเธอที่สุดในโลกเลย ❤️";
let ti=0;
function startType(){
 const el=document.getElementById("typing-text");
 el.innerHTML='<span class="cursor"></span>';
 (function t(){
   if(ti<msg.length){
     let ch=msg.substring(ti,ti+4)==="<br>"?"<br>":msg[ti];
     ti+=ch==="<br>"?4:1;
     el.querySelector(".cursor").insertAdjacentHTML("beforebegin",ch);
     setTimeout(t,80);
   }
 })();
}

/* Lyrics */
const lyrics=[
 {t:"เธอเพียงคนเดียวและเพียงเธอที่ต้องการ",d:4200},
 {t:"ฉันจะทำทุกทุกทางด้วยวิญญาณและหัวใจ",d:4500},
 {t:"นั่นคือฉันจะรักเธอไม่ว่าเป็นเมื่อไรสถานใด",d:5300},
 {t:"ทั้งหัวใจฉันมีเธอเพียงคนเดียว ❤️",d:5400}
];
let li=0;
function playLyrics(){
 if(isPaused||li>=lyrics.length) return;
 lyricEl.textContent=lyrics[li].t;
 lyricEl.classList.add("visible");
 lyricTimer=setTimeout(()=>{
   lyricEl.classList.remove("visible");
   li++;
   lyricTimer=setTimeout(playLyrics,800);
 },lyrics[li].d);
}

/* Open */
function openGift(){
 welcome.style.opacity=0;
 setTimeout(()=>{
   welcome.style.display="none";
   main.style.display="flex";
   requestAnimationFrame(()=>{
     main.style.opacity=1;
     music.play();
     setTimeout(startType,1000);
     li=0;
     playLyrics();
   });
 },1000);
}

/* Music sync */
music.addEventListener("timeupdate",()=>{
 progress.style.width=(music.currentTime/music.duration*100)+"%";
});

/* 🔴 PAUSE EVERYTHING WHEN TAB HIDDEN */
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
   isPaused=true;
   music.pause();
   if(lyricTimer) clearTimeout(lyricTimer);
 }else{
   isPaused=false;
   music.play().then(()=>{
     li=0;
     lyricEl.classList.remove("visible");
     playLyrics();
   }).catch(()=>{});
 }
});

/* Timer */
const start=new Date(2025,5,25).getTime();
setInterval(()=>{
 const d=Date.now()-start;
 if(d<0)return;
 document.getElementById("timer").textContent=
 `${Math.floor(d/86400000)} วัน ${Math.floor(d%86400000/3600000)} ชม. ${Math.floor(d%3600000/60000)} น. ${Math.floor(d%60000/1000)} วิ`;
},1000);
</script>

</body>
</html>
