<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy 6 Months Anniversary!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* --- Global Styles --- */
html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: 'Sarabun', sans-serif;
    background: linear-gradient(135deg, #ffe6e6 0%, #ffcce0 100%);
    color: #d63384;
    position: relative;
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 3em;
    margin-bottom: 0.5em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

/* --- Floating Hearts Background --- */
.heart-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 0;
}
.heart {
    position: absolute;
    bottom: -10vh;
    font-size: 20px;
    color: #ff99cc;
    opacity: 0.6;
    animation: float 6s linear infinite;
}
@keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

/* --- Welcome Screen (Glassmorphism) --- */
#welcome-screen {
    position: fixed;
    inset: 0;
    background: rgba(255, 204, 221, 0.6);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    transition: opacity 1s ease-in-out;
}

.pin-container {
    display: flex;
    gap: 12px;
    margin: 30px 0;
}

.pin-container input {
    width: 50px;
    height: 60px;
    font-size: 2rem;
    text-align: center;
    border-radius: 12px;
    border: 2px solid rgba(255, 128, 191, 0.5);
    background: rgba(255, 245, 248, 0.8);
    color: #d63384;
    transition: all 0.3s ease;
}

.pin-container input:focus {
    transform: translateY(-3px);
    border-color: #d63384;
    background: #fff;
}

/* --- Main Content --- */
#main-content {
    display: none;
    opacity: 0;
    height: 100vh;
    justify-content: center;
    align-items: center;
    transition: opacity 1.5s ease-in-out;
    z-index: 50;
}

.container {
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 20px 40px rgba(214, 51, 132, 0.2), inset 0 0 20px rgba(255,255,255,0.2);
    padding: 30px;
    border-radius: 30px;
    width: 400px;
    max-width: 90%;
    text-align: center;
}

/* --- 3D Photo Frame --- */
.photo-frame {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid rgba(255, 153, 204, 0.8);
    margin: 20px auto;
    box-shadow: 0 0 30px rgba(255, 153, 204, 0.6);
    animation: heartbeat 3s ease-in-out infinite;
}
@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
.photo-frame video { width: 100%; height: 100%; object-fit: cover; }

/* --- Typewriter & Cursor --- */
.message-text {
    font-size: 1.1rem;
    min-height: 3.5em;
    color: #d63384;
    margin-bottom: 10px;
}
.cursor {
    display: inline-block;
    width: 2px;
    background-color: #d63384;
    animation: blink 1s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* --- Progress Bar --- */
.progress-container {
    width: 80%;
    height: 6px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 10px;
    margin: 20px auto;
    overflow: hidden;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff99cc, #ff3366);
    transition: width 0.1s linear;
}

/* --- Love Button --- */
#love-button {
    background: none;
    border: none;
    font-size: 2.5rem;
    cursor: pointer;
    transition: transform 0.2s;
    outline: none;
}
#love-button:active { transform: scale(1.2); }

.timer {
    margin-top: 15px;
    font-weight: bold;
    color: #ff6699;
    background: rgba(255, 240, 245, 0.5);
    padding: 8px 20px;
    border-radius: 20px;
    display: inline-block;
}

.lyric-text {
    font-family: 'Dancing Script', cursive;
    font-size: 1.2rem;
    height: 2.5em;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.8s;
}
.lyric-text.visible { opacity: 1; }
</style>
</head>

<body>

<div class="heart-bg" id="heart-bg"></div>
<audio id="bg-music"><source src="song.mp3" type="audio/mp3"></audio>

<div id="welcome-screen">
    <h1>เค้ามีอะไรจะบอก</h1>
    <p>ใส่รหัส 6 ตัวนะที่รัก ❤️</p>
    <div class="pin-container">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
        <input type="password" maxlength="1" inputmode="numeric">
    </div>
    <p id="error-text" style="color:red"></p>
</div>

<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months!</h1>
        <div class="photo-frame">
            <video src="mylove.mp4" autoplay loop muted playsinline></video>
        </div>
        <p class="message-text" id="typing-text"></p>
        <div id="lyric-text" class="lyric-text"></div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <button id="love-button">💖</button>
        <p style="font-size: 0.7rem; margin-top: -10px;">กดรับความรักตรงนี้สิ</p>

        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
const correctPassword = "250625";
const inputs = document.querySelectorAll(".pin-container input");
const music = document.getElementById("bg-music");
const progressBar = document.getElementById("progress-bar");
const typingText = document.getElementById("typing-text");

// --- Input Logic ---
inputs[0].focus();
inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
        if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
        if ([...inputs].map(inp => inp.value).join("").length === 6) checkPin();
    });
    input.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
});

function checkPin() {
    const pin = [...inputs].map(i => i.value).join("");
    if (pin === correctPassword) {
        document.getElementById("welcome-screen").style.opacity = 0;
        setTimeout(openGift, 1000);
    } else {
        document.getElementById("error-text").innerText = "รหัสผิดอะ ลองใหม่นะ 🥺";
        inputs.forEach(i => i.value = "");
        inputs[0].focus();
    }
}

function openGift() {
    document.getElementById("welcome-screen").style.display = "none";
    const main = document.getElementById("main-content");
    main.style.display = "flex";
    setTimeout(() => {
        main.style.opacity = 1;
        music.play();
        startTypewriter();
        startLyrics();
    }, 100);
}

// --- Typewriter Effect ---
const message = "ขอบคุณที่อยู่ข้างกันมาตลอด 6 เดือนนะ<br>รักเธอที่สุดในโลกเลย ❤️";
let charIndex = 0;
function startTypewriter() {
    typingText.innerHTML = '<span class="cursor"></span>';
    function type() {
        if (charIndex < message.length) {
            let char = message.charAt(charIndex);
            if (message.substring(charIndex, charIndex + 4) === "<br>") {
                char = "<br>"; charIndex += 3;
            }
            document.querySelector('.cursor').insertAdjacentHTML('beforebegin', char);
            charIndex++;
            setTimeout(type, 100);
        }
    }
    type();
}

// --- Love Burst ---
document.getElementById('love-button').addEventListener('click', function(e) {
    for (let i = 0; i < 12; i++) {
        const h = document.createElement('div');
        h.innerHTML = ['❤️','💖','💕'][Math.floor(Math.random()*3)];
        h.style.position = 'fixed';
        h.style.left = e.clientX + 'px';
        h.style.top = e.clientY + 'px';
        h.style.pointerEvents = 'none';
        document.body.appendChild(h);
        
        const destX = (Math.random() - 0.5) * 400;
        const destY = (Math.random() - 0.5) * 400;
        
        h.animate([
            { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
            { transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(0)`, opacity: 0 }
        ], { duration: 1000, easing: 'ease-out' }).onfinish = () => h.remove();
    }
});

// --- Music & Lyrics ---
music.addEventListener("timeupdate", () => {
    progressBar.style.width = (music.currentTime / music.duration * 100) + "%";
});

const lyrics = [
    { text: "เธอเพียงคนเดียวและเพียงเธอที่ต้องการ", time: 4200 },
    { text: "ฉันจะทำทุกทุกทางด้วยวิญญาณและหัวใจ", time: 8700 },
    { text: "นั่นคือฉันจะรักเธอไม่ว่าเป็นเมื่อไร", time: 14000 },
    { text: "ทั้งหัวใจฉันมีเธอเพียงคนเดียว ❤️", time: 19400 }
];

function startLyrics() {
    const el = document.getElementById("lyric-text");
    lyrics.forEach(line => {
        setTimeout(() => {
            el.innerText = line.text;
            el.classList.add("visible");
            setTimeout(() => el.classList.remove("visible"), 3500);
        }, line.time);
    });
}

// --- Background Hearts ---
setInterval(() => {
    const h = document.createElement('div');
    h.classList.add('heart');
    h.innerHTML = '❤️';
    h.style.left = Math.random() * 100 + 'vw';
    document.getElementById('heart-bg').appendChild(h);
    setTimeout(() => h.remove(), 6000);
}, 800);

// --- Timer ---
const startDate = new Date(2025, 5, 25).getTime();
setInterval(() => {
    const d = Date.now() - startDate;
    const days = Math.floor(d / 86400000);
    const hrs = Math.floor((d % 86400000) / 3600000);
    const mins = Math.floor((d % 3600000) / 60000);
    const secs = Math.floor((d % 60000) / 1000);
    document.getElementById("timer").innerText = `${days} วัน ${hrs} ชม. ${mins} น. ${secs} วิ`;
}, 1000);
</script>
</body>
</html>
