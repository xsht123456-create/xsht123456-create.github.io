<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy 6 Months Anniversary!</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: 'Sarabun', sans-serif;
    background: #ffe6e6;
    color: #d63384;
}

#welcome-screen {
    position: fixed;
    inset: 0;
    background: #ffccdd;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 1000;
    transition: opacity 1s;
}

.pin-container {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.pin-container input {
    width: 45px;
    height: 55px;
    font-size: 1.6rem;
    text-align: center;
    border-radius: 10px;
    border: 2px solid #ff4d94;
    outline: none;
}

.pin-container input:focus {
    border-color: #ff1f7a;
}

#error-text {
    color: red;
    margin-top: 10px;
}

#main-content {
    display: none;
    opacity: 0;
    height: 100vh;
    justify-content: center;
    align-items: center;
    transition: opacity 1.5s;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 350px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,.1);
}

.photo-frame {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #ff99cc;
    margin: 15px auto;
}

.photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.lyric-text {
    font-weight: bold;
    color: #ff6699;
    opacity: 0;
    transition: 1s;
}

.lyric-text.visible {
    opacity: 1;
}

.timer {
    margin-top: 10px;
    font-weight: bold;
    color: #ff6699;
}

@media (max-width:480px){
    .pin-container input {
        width: 42px;
        height: 52px;
        font-size: 1.4rem;
    }
}
</style>
</head>

<body>

<audio id="bg-music" loop>
    <source src="song.mp3" type="audio/mp3">
</audio>

<!-- หน้า PIN -->
<div id="welcome-screen">
    <h1>เค้ามีอะไรจะบอก</h1>
    <p>ใส่รหัส 6 ตัว ❤️</p>

    <div class="pin-container">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
        <input maxlength="1" inputmode="numeric">
    </div>

    <p id="error-text"></p>
</div>

<!-- เนื้อหาหลัก -->
<div id="main-content">
    <div class="container">
        <h1>Happy 6 Months</h1>

        <div class="photo-frame">
            <img src="mylove.jpg">
        </div>

        <p>ขอบคุณที่อยู่ข้างกันมาตลอด 6 เดือนนะ<br>รักเธอมาก ❤️</p>

        <div id="lyric-text" class="lyric-text"></div>
        <div class="timer" id="timer"></div>
    </div>
</div>

<script>
const correctPassword = "250625";
const inputs = document.querySelectorAll(".pin-container input");

inputs[0].focus();

/* คุมการพิมพ์ PIN */
inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, '');
        if (input.value && i < inputs.length - 1) {
            inputs[i + 1].focus();
        }
        checkPin();
    });

    input.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !input.value && i > 0) {
            inputs[i - 1].focus();
        }
    });
});

function checkPin() {
    const pin = Array.from(inputs).map(i => i.value).join("");
    if (pin.length === 6) {
        if (pin === correctPassword) {
            openGift();
        } else {
            document.getElementById("error-text").innerText = "รหัสไม่ถูกต้อง 🥺";
            inputs.forEach(i => i.value = "");
            inputs[0].focus();
        }
    }
}

function openGift() {
    const welcome = document.getElementById("welcome-screen");
    const main = document.getElementById("main-content");
    const music = document.getElementById("bg-music");

    music.volume = 0.5;
    music.play();

    welcome.style.opacity = 0;
    setTimeout(() => {
        welcome.style.display = "none";
        main.style.display = "flex";
        setTimeout(() => main.style.opacity = 1, 50);
        startLyrics();
    }, 1000);
}

/* เนื้อเพลง */
const lyrics = [
    "เธอเพียงคนเดียวและเพียงเธอที่ต้องการ",
    "ฉันจะทำทุกทุกทางด้วยวิญญาณและหัวใจ",
    "นั่นคือฉันจะรักเธอไม่ว่าเป็นเมื่อไรสถานใด",
    "ทั้งหัวใจฉันมีเธอเพียงคนเดียว ❤️"
];

let li = 0;
function startLyrics() {
    const el = document.getElementById("lyric-text");
    function show() {
        if (li >= lyrics.length) return;
        el.innerText = lyrics[li++];
        el.classList.add("visible");
        setTimeout(() => {
            el.classList.remove("visible");
            setTimeout(show, 1000);
        }, 4500);
    }
    show();
}

/* ตัวนับเวลา */
const startDate = new Date(2025, 5, 25).getTime();
setInterval(() => {
    const d = Date.now() - startDate;
    document.getElementById("timer").innerText =
        Math.floor(d/86400000)+" วัน "+
        Math.floor(d%86400000/3600000)+" ชม. "+
        Math.floor(d%3600000/60000)+" น. "+
        Math.floor(d%60000/1000)+" วิ";
}, 1000);

/* ปิด gesture */
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => e.preventDefault(), { passive:false });
</script>

</body>
</html>
