<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เธอจะรักฉันไหมนะ</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1{
    color:#fff;
    margin-bottom:30px;
    font-size:2.5rem;
}

.buttons{
    display: flex;
    justify-content: center;
    gap: 20px;
}

/* ปุ่มขนาดเท่ากัน */
button{
    width: 120px;
    height: 70px;
    font-size: 20px;
    border: none;
    border-radius: 35px;
    cursor: pointer;
    transition: 0.3s ease;
}

#yes{
    background:#4CAF50;
    color:white;
}

#no{
    background:#ff4d4d;
    color:white;
}
</style>
</head>

<body>

<h1>เธอจะรักเค้ามั้ยนะ 💖</h1>

<div class="buttons">
    <button id="yes" onclick="yesClick()">รัก</button>
    <button id="no" onclick="moveNo()">ไม่รัก</button>
</div>

<script>
let scale = 1;

function moveNo(){
    const noBtn = document.getElementById("no");

    noBtn.style.position = "fixed";

    const x = Math.random() * (window.innerWidth - 130);
    const y = Math.random() * (window.innerHeight - 80);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    scale -= 0.15;
    if(scale < 0.1){
        noBtn.style.display = "none";
    } else {
        noBtn.style.transform = `scale(${scale})`;
    }
}

function yesClick(){
    document.body.innerHTML = `
        <h1 style="color:white;font-size:3rem;">
           เย้~เค้ารู้ว่ารักอยู่แล้ว 💕🥰
        </h1>
    `;
}
</script>

</body>
</html>
